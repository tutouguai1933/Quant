global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: 'quant-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9091']
        labels:
          instance: 'prometheus'

  # Quant API service
  - job_name: 'quant-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9011']
        labels:
          service: 'api'
          container: 'quant-api'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'quant-api'

  # cAdvisor for Docker container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: 'cadvisor'

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'node-exporter'
